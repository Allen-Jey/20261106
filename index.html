<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的地點手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#16302B; --muted:#5B6F6A; --line:#D3DCDA;
  --travel:#2563A8; --food:#C2410C; --work:#1F7A4D; --star:#E0A400; --danger:#B42318;
  --sheet-shadow:0 -8px 30px rgba(22,48,43,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A18; --surface:#182623; --ink:#E4EEEB; --muted:#9AB0AA; --line:#2B3D39;
    --travel:#6FA8E8; --food:#F08A5D; --work:#5CC793; --star:#F2C14E; --danger:#F97066;
    --sheet-shadow:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A18; --surface:#182623; --ink:#E4EEEB; --muted:#9AB0AA; --line:#2B3D39;
  --travel:#6FA8E8; --food:#F08A5D; --work:#5CC793; --star:#F2C14E; --danger:#F97066;
  --sheet-shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","微軟正黑體","PingFang TC",sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--travel);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:18px 0 10px}
h1{margin:0 0 2px;font-size:28px;font-weight:900;letter-spacing:.02em}
.sync{font-size:13px;color:var(--muted);min-height:20px}

.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto}
.tab{flex:1;min-width:64px;border:0;border-radius:12px;padding:10px 4px;background:var(--surface);
  font-weight:700;font-size:15px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tab[aria-pressed="true"]{color:#fff;box-shadow:none}
.tab[data-cat="all"][aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab[data-cat="travel"][aria-pressed="true"]{background:var(--travel)}
.tab[data-cat="food"][aria-pressed="true"]{background:var(--food)}
.tab[data-cat="work"][aria-pressed="true"]{background:var(--work)}

.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px}

.list{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:540px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.list > li{min-width:0}
.card{display:block;width:100%;border:0;padding:0;text-align:left;background:var(--surface);border-radius:16px;overflow:hidden;color:var(--ink)}
.card[data-cat="travel"],.dview[data-cat="travel"]{--c:var(--travel)}
.card[data-cat="food"],.dview[data-cat="food"]{--c:var(--food)}
.card[data-cat="work"],.dview[data-cat="work"]{--c:var(--work)}
.pic{aspect-ratio:4/3;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
.badge{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.92);color:#16302B}
.badge.done{background:#16302B;color:#fff}
.cbody{padding:9px 11px 12px}
.cname{font-size:16px;font-weight:700;margin:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cstars{color:var(--star);font-size:14px;letter-spacing:1px;min-height:1.4em;margin-top:2px}
.dhead{margin:-18px -16px 0;height:120px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:64px;border-radius:20px 20px 0 0}
.dname{margin:14px 0 2px;font-size:22px;font-weight:900;word-break:break-word}
.dmeta{color:var(--muted);font-size:14px}
.dview .actions{margin-top:18px}
.item{background:var(--surface);border-radius:14px;padding:14px 14px 12px 18px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.item[data-cat="travel"]{--c:var(--travel)} .item[data-cat="food"]{--c:var(--food)} .item[data-cat="work"]{--c:var(--work)}
.top{display:flex;align-items:flex-start;gap:8px}
.name{flex:1;font-size:18px;font-weight:700;margin:0;word-break:break-word}
.status{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;border:1.5px solid var(--c);color:var(--c)}
.status.done{background:var(--c);color:var(--surface)}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.stars{color:var(--star);letter-spacing:2px;font-size:15px}
.note{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.actions{display:flex;gap:8px;margin-top:12px}
.go{flex:1;border:0;border-radius:10px;padding:10px;background:var(--c);color:#fff;font-weight:700;text-align:center;text-decoration:none}
.edit{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;font-weight:500}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:6;border:0;border-radius:999px;padding:14px 28px;background:var(--ink);color:var(--bg);
  font-weight:700;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  box-shadow:var(--sheet-shadow);max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.open .scrim{display:block} .open .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:600px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:12px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
textarea.field{min-height:90px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:30px;line-height:1;padding:2px 4px;color:var(--line)}
.rate button.on{color:var(--star)}
.row{display:flex;gap:8px;margin-top:22px}
.save{flex:1;border:0;border-radius:12px;padding:13px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px}
.cancel{border:1px solid var(--line);background:transparent;border-radius:12px;padding:13px 18px}
.del{display:block;width:100%;margin-top:14px;border:0;background:none;color:var(--danger);padding:10px;font-weight:700}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的地點手帳</h1>
    <div class="sync" id="sync">連線中…</div>
    <div class="tabs" role="group" aria-label="分類">
      <button class="tab" data-cat="all" aria-pressed="true">全部</button>
      <button class="tab" data-cat="travel" aria-pressed="false">旅遊</button>
      <button class="tab" data-cat="food" aria-pressed="false">美食</button>
      <button class="tab" data-cat="work" aria-pressed="false">工作</button>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="搜尋名稱或備註" aria-label="搜尋">
      <select id="st" aria-label="狀態篩選">
        <option value="all">全部狀態</option>
        <option value="want">想去</option>
        <option value="done">去過</option>
      </select>
    </div>
  </header>
  <ul class="list" id="list"></ul>
</div>

<button class="fab" id="add">＋ 新增地點</button>

<div id="modal">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-in">
      <h2 id="sheetTitle">新增地點</h2>
      <label for="fName">名稱</label>
      <input class="field" id="fName" placeholder="例如：阿嬤的麵店">
      <label>分類</label>
      <div class="seg" id="fCat">
        <button type="button" data-v="travel">旅遊</button>
        <button type="button" data-v="food">美食</button>
        <button type="button" data-v="work">工作</button>
      </div>
      <label for="fUrl">Google 地圖連結 <span class="hint">（選填，Google 地圖按「分享」複製貼上）</span></label>
      <input class="field" id="fUrl" inputmode="url" placeholder="https://maps.app.goo.gl/…">
      <label>狀態</label>
      <div class="seg" id="fStatus">
        <button type="button" data-v="want">想去</button>
        <button type="button" data-v="done">去過</button>
      </div>
      <label>我的評分 <span class="hint">（再點一次同一顆星可清除）</span></label>
      <div class="rate" id="fRate"></div>
      <label for="fNote">備註 <span class="hint">（營業時間、必點、提醒）</span></label>
      <textarea class="field" id="fNote" placeholder="例如：週一公休｜必點乾麵｜停車不方便"></textarea>
      <div class="err" id="fErr"></div>
      <div class="row">
        <button class="cancel" id="cancel" type="button">取消</button>
        <button class="save" id="save" type="button">儲存</button>
      </div>
      <button class="del" id="del" type="button" hidden>刪除這個地點</button>
    </div>
  </div>
</div>

<div id="dmodal">
  <div class="scrim" id="dscrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="sheet-in dview" id="dview">
      <div class="dhead" id="dIcon"></div>
      <h2 class="dname" id="dName"></h2>
      <div class="dmeta" id="dMeta"></div>
      <div class="stars" id="dStars"></div>
      <p class="note" id="dNote"></p>
      <div class="actions">
        <a class="go" id="dGo" target="_blank" rel="noopener">用 Google 地圖導航</a>
        <button class="edit" id="dEdit" type="button">編輯</button>
      </div>
      <button class="del" id="dClose" type="button" style="color:var(--muted)">關閉</button>
    </div>
  </div>
</div>

<script>
(function(){
  const ICON = {travel:"🏞️", food:"🍜", work:"🏢"};
  const CAT = {travel:"旅遊", food:"美食", work:"工作"};
  const $ = id => document.getElementById(id);
  let places = [];           // [{id, ...data}]
  let col = null;            // db collection or null
  let local = false;         // using browser fallback
  let view = {cat:"all", q:"", st:"all"};
  let form = null;           // {id|null, cat, status, rating}

  /* ---------- storage ---------- */
  const LKEY = "place-notebook-v1";
  function loadLocal(){
    try{ places = JSON.parse(localStorage.getItem(LKEY) || "[]"); }catch(e){ places = []; }
  }
  function saveLocal(){
    try{ localStorage.setItem(LKEY, JSON.stringify(places)); }catch(e){}
  }
  function useLocal(msg){
    local = true; col = null;
    loadLocal();
    $("sync").textContent = msg;
    render();
  }

  async function init(){
    render();
    let db = null, user = null;
    try{
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }catch(e){}
    if(!db || !user){ useLocal(window.claude ? "未登入：資料只存在這台裝置" : "資料存在這台裝置的瀏覽器中"); return; }
    const uid = await user.id();
    if(!uid){ useLocal("未登入：資料只存在這台裝置"); return; }
    col = db.collection("data/users/" + uid);
    let first = true;
    const timer = setTimeout(()=>{ if(first) $("sync").textContent = "暫時連不上，資料可能還沒更新"; }, 10000);
    col.onSnapshot(snap=>{
      places = snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id}, d.data()));
      if(!snap.metadata.fromCache){
        first = false; clearTimeout(timer);
        $("sync").textContent = "已同步：手機、電腦登入同帳號都看得到";
      }
      render();
    }, err=>{
      clearTimeout(timer);
      useLocal("無法連到雲端，暫存在這台裝置");
    });
  }

  /* ---------- list ---------- */
  function mapsHref(p){
    const u = (p.url||"").trim();
    if(/^https?:\/\//i.test(u)) return u;
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name||"");
  }
  function stars(n){ return n ? "★".repeat(n) + "☆".repeat(5-n) : ""; }

  function render(){
    const list = $("list");
    list.textContent = "";
    const q = view.q.trim().toLowerCase();
    const shown = places
      .filter(p => view.cat==="all" || p.cat===view.cat)
      .filter(p => view.st==="all" || p.status===view.st)
      .filter(p => !q || (p.name||"").toLowerCase().includes(q) || (p.note||"").toLowerCase().includes(q))
      .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

    if(!shown.length){
      const li = document.createElement("li");
      li.className = "empty";
      const s = document.createElement("strong");
      if(places.length){ s.textContent = "沒有符合的地點"; li.append(s, "換個分類或搜尋字試試看"); }
      else { s.textContent = "還沒有任何地點"; li.append(s, "點下方「新增地點」，把第一個想去的地方存起來"); }
      list.append(li);
      return;
    }
    for(const p of shown){
      const li = document.createElement("li");
      const card = document.createElement("button");
      card.type = "button"; card.className = "card"; card.dataset.cat = p.cat;

      const pic = document.createElement("div"); pic.className = "pic";
      pic.textContent = ICON[p.cat] || "📍";
      const st = document.createElement("span");
      st.className = "badge" + (p.status==="done" ? " done" : "");
      st.textContent = p.status==="done" ? "去過" : "想去";
      pic.append(st);

      const body = document.createElement("div"); body.className = "cbody";
      const h = document.createElement("h3"); h.className = "cname"; h.textContent = p.name;
      const s = document.createElement("div"); s.className = "cstars"; s.textContent = stars(p.rating);
      body.append(h, s);

      card.append(pic, body);
      card.addEventListener("click", ()=>openDetail(p));
      li.append(card);
      list.append(li);
    }
  }

  /* ---------- detail ---------- */
  let current = null;
  function openDetail(p){
    current = p;
    $("dview").dataset.cat = p.cat;
    $("dIcon").textContent = ICON[p.cat] || "📍";
    $("dName").textContent = p.name;
    $("dMeta").textContent = (CAT[p.cat]||"") + "｜" + (p.status==="done" ? "去過" : "想去");
    $("dStars").textContent = stars(p.rating);
    $("dNote").textContent = p.note || "";
    $("dNote").hidden = !p.note;
    $("dGo").href = mapsHref(p);
    $("dmodal").classList.add("open");
  }
  function closeDetail(){ $("dmodal").classList.remove("open"); current = null; }
  $("dClose").addEventListener("click", closeDetail);
  $("dscrim").addEventListener("click", closeDetail);
  $("dEdit").addEventListener("click", ()=>{ const p = current; closeDetail(); if(p) openForm(p); });

  /* ---------- form ---------- */
  function setSeg(el, v){ el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===v))); }
  function drawRate(){
    const r = $("fRate"); r.textContent = "";
    for(let i=1;i<=5;i++){
      const b = document.createElement("button");
      b.type = "button"; b.textContent = "★";
      b.className = i <= form.rating ? "on" : "";
      b.setAttribute("aria-label", i + " 顆星");
      b.addEventListener("click", ()=>{ form.rating = (form.rating===i ? 0 : i); drawRate(); });
      r.append(b);
    }
  }
  function openForm(p){
    const defCat = view.cat==="all" ? "travel" : view.cat;
    form = p ? {id:p.id, cat:p.cat||"travel", status:p.status||"want", rating:p.rating||0}
             : {id:null, cat:defCat, status:"want", rating:0};
    $("sheetTitle").textContent = p ? "編輯地點" : "新增地點";
    $("fName").value = p ? (p.name||"") : "";
    $("fUrl").value = p ? (p.url||"") : "";
    $("fNote").value = p ? (p.note||"") : "";
    $("fErr").textContent = "";
    $("del").hidden = !p;
    setSeg($("fCat"), form.cat); setSeg($("fStatus"), form.status); drawRate();
    $("modal").classList.add("open");
    setTimeout(()=>$("fName").focus(), 260);
  }
  function closeForm(){ $("modal").classList.remove("open"); form = null; }

  $("fCat").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ form.cat=b.dataset.v; setSeg($("fCat"),form.cat);} });
  $("fStatus").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ form.status=b.dataset.v; setSeg($("fStatus"),form.status);} });

  let busy = false;
  $("save").addEventListener("click", async ()=>{
    if(busy) return;
    const name = $("fName").value.trim();
    if(!name){ $("fErr").textContent = "請輸入名稱"; $("fName").focus(); return; }
    const data = { name, cat:form.cat, url:$("fUrl").value.trim(), status:form.status,
                   rating:form.rating, note:$("fNote").value.trim(), updatedAt:Date.now() };
    busy = true; $("save").textContent = "儲存中…";
    try{
      if(col){
        const ref = form.id ? col.doc(form.id) : col.doc();
        await ref.set(data);
      }else{
        if(form.id){ const i = places.findIndex(x=>x.id===form.id); if(i>-1) places[i] = Object.assign({id:form.id}, data); }
        else places.push(Object.assign({id:"p"+Date.now()}, data));
        saveLocal(); render();
      }
      closeForm();
    }catch(e){
      $("fErr").textContent = e && e.code==="quota_exceeded" ? "空間已滿，請先刪除一些地點再新增" : "沒有存成功，請再按一次儲存";
    }finally{ busy = false; $("save").textContent = "儲存"; }
  });

  $("del").addEventListener("click", async ()=>{
    if(!form || !form.id) return;
    if(!confirm("確定刪除「" + $("fName").value.trim() + "」？刪除後無法復原。")) return;
    try{
      if(col){ await col.doc(form.id).delete(); }
      else { places = places.filter(x=>x.id!==form.id); saveLocal(); render(); }
      closeForm();
    }catch(e){ $("fErr").textContent = "沒有刪除成功，請再試一次"; }
  });

  $("cancel").addEventListener("click", closeForm);
  $("scrim").addEventListener("click", closeForm);
  document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return; if(form) closeForm(); else if(current) closeDetail(); });
  $("add").addEventListener("click", ()=>openForm(null));

  /* ---------- filters ---------- */
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>{
    view.cat = t.dataset.cat;
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed", String(x===t)));
    render();
  }));
  $("q").addEventListener("input", e=>{ view.q = e.target.value; render(); });
  $("st").addEventListener("change", e=>{ view.st = e.target.value; render(); });

  init();
})();
</script>
</body>
</html>
